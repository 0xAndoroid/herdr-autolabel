# herdr-autolabel — labels every pane with a terse title describing what is happening in it.
# Install: cargo build --release && herdr plugin link ~/dev/herdr-autolabel
id = "andoroid.autolabel"
name = "Auto-label panes and spaces"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

# Runs once per server start (after session restore, socket ready). Spawns the
# detached daemon and exits immediately.
[[startup]]
command = ["target/release/herdr-autolabel", "start"]

[[actions]]
id = "start"
title = "Start auto-label daemon"
contexts = ["workspace"]
command = ["target/release/herdr-autolabel", "start"]

[[actions]]
id = "stop"
title = "Stop auto-label daemon"
contexts = ["workspace"]
command = ["target/release/herdr-autolabel", "stop"]

[[actions]]
id = "relabel"
title = "Relabel panes and spaces now"
contexts = ["workspace"]
command = ["target/release/herdr-autolabel", "once", "--force"]
