[package]
name = "herdr-autolabel"
version = "0.1.0"
edition = "2024"
description = "herdr plugin daemon that labels every pane and sidebar space with a terse title describing what is happening in it"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
