[package]
name = "herdr-autolabel"
version = "0.1.0"
edition = "2024"
description = "herdr plugin daemon that labels every pane and sidebar space with a terse title describing what is happening in it"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
# Pedantic baseline; priority -1 lets individual lints override.
pedantic = { level = "warn", priority = -1 }

case_sensitive_file_extension_comparisons = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
fn_params_excessive_bools = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
ref_option_ref = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
used_underscore_binding = "allow"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

allow_attributes = "deny"
undocumented_unsafe_blocks = "deny"

result_large_err = "allow"

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

enum_variant_names = "allow"
large_futures = "allow"
significant_drop_tightening = "allow"
