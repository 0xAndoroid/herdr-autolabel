# herdr-autolabel config — lives at $HERDR_PLUGIN_CONFIG_DIR/config.toml
# (`herdr plugin config-dir andoroid.autolabel`). Every key is optional.

# Seconds between passes over all panes.
interval_secs = 1

# LLM provider: "auto" (cerebras, else openai, else none, by key presence),
# "cerebras", "anthropic", "openai", or "none" (heuristics only).
provider = "auto"

# Model override for the selected provider. Defaults:
#   cerebras  = "qwen-3.8-27b"
#   anthropic = "claude-haiku-4-5"
#   openai    = "gpt-5.6-luna"
# model = "qwen-3.8-27b"

# Optional pane and workspace prompt overrides. Names describe the task only;
# repository, agent, and branch are displayed on separate sidebar rows.
# prompt = "Name the user's task in this pane. Return only a short action phrase."
# space_prompt = "Summarize the shared purpose of all panes. Return only a short description."

# Debug logs include scrubbed LLM context/replies, rejection/retry decisions,
# fingerprints, cache hits, rate limits, and metadata writes. Restart to apply.
debug = false

# Hard cap on label length (characters): pane titles, and space names as a whole.
max_chars = 25

# Lines of recent pane output inspected (and sent, scrubbed, to the LLM).
lines = 40

# Minimum seconds between LLM requests for the same pane or workspace.
llm_per_pane_secs = 15

# Shared pane/workspace LLM request budget per rolling minute; a rejected reply retries once.
llm_global_per_min = 6

# Globs matched against pane_id ("w1:p2"), workspace_id ("w1") and cwd.
# If `allow` is non-empty, only matching panes are labeled. `deny` always wins.
allow = []
deny = []

# Pane titles use display metadata; workspace names use workspace.rename.
# Manual pane names and workspace renames made after takeover win. Stop restores original
# workspace names. Folder/branch metadata is separate from these title toggles.
label_panes = true
label_spaces = true
