# herdr-autolabel config — lives at $HERDR_PLUGIN_CONFIG_DIR/config.toml
# (`herdr plugin config-dir andoroid.autolabel`). Every key is optional.

# Seconds between passes over all panes.
interval_secs = 1

# LLM provider: "auto" (cerebras, else openai, else none, by key presence),
# "cerebras", "anthropic", "openai", or "none" (heuristics only).
provider = "auto"

# Model override for the selected provider. Defaults:
#   cerebras  = "qwen-3.8-27b"
#   anthropic = "claude-haiku-4-5"
#   openai    = "gpt-5.6-luna"
# model = "qwen-3.8-27b"

# System prompt for the LLM; replaces the built-in text (shown here). The user message adds
# the facts: request, session topic, command, cwd, branch, name budget, PR mentions, screen.
# prompt = """
# You name terminal panes for a sidebar. Reply with ONLY the name: at most the number of characters given, no quotes, no trailing punctuation, no explanation. Shape: '<project>: <task>'. <project> is a short form of the project name ('herdr' for herdr-autolabel); a repository name always stays, leave it out only for a home or scratch folder (dev, Downloads, dotfiles). <task> is a 1–3 word phrase. When a 'user's request' line is present (the user's last prompt to a coding agent, or the agent's summary of it), <task> MUST paraphrase that request and nothing else: not the file the agent has open, not the command it is running right now. 'session topic' and 'session's first request' say what the whole session is about and serve <project> only: when they, the branch or the command name an app or sub-project inside the repository, that is the <project> ('api: switch to fable' for the api app in the shop repository); they never shape <task>. Otherwise name what is being done, preferring concrete nouns: PR numbers ('review PR 1283'), branch names, file names, commands. For a shell command, keep the argument that tells this run apart (the app, service, target or file) and say what runs under it: 'api docker logs' for `shop dev --app api` running `docker logs`, never the bare tool.
# """

# Hard cap on label length (characters): pane titles, and space names as a whole.
max_chars = 25

# Lines of recent pane output inspected (and sent, scrubbed, to the LLM).
lines = 40

# Minimum seconds between LLM calls for the same pane.
llm_per_pane_secs = 15

# Global LLM budget, calls per minute (rolling 60-second window).
llm_global_per_min = 6

# Globs matched against pane_id ("w1:p2"), workspace_id ("w1") and cwd.
# If `allow` is non-empty, only matching panes are labeled. `deny` always wins.
allow = []
deny = []

# What gets labelled. Panes get a display-only title (shown in pane borders); spaces — the
# workspace rows in the sidebar — are renamed after the activity of their panes (herdr has no
# display-only title for workspaces). Names you typed yourself are never touched, and our space
# names are put back when the daemon stops.
label_panes = true
label_spaces = true
